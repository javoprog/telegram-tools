name: CI/CD & Deploy to Coolify

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: telegram-tools-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/telegram-tools:latest
            ghcr.io/${{ github.repository_owner }}/telegram-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify webhook
        if: env.COOLIFY_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-all-errors \
            "$COOLIFY_WEBHOOK_URL"
