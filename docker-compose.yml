services:
  telegram-tools:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - TG_API_ID=${TG_API_ID:?TG_API_ID is required}
      - TG_API_HASH=${TG_API_HASH:?TG_API_HASH is required}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    volumes:
      - tg_data:/app/data

volumes:
  tg_data:
    driver: local
